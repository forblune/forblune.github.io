<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지를 찾을 수 없음 — Not found</title>
<meta name="robots" content="noindex, follow">

<meta name="description" content="이 주소에는 페이지가 없습니다.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="페이지를 찾을 수 없음 — Not found">
<meta property="og:description" content="이 주소에는 페이지가 없습니다.">
<meta property="og:url" content="https://forblune.github.io/404.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="페이지를 찾을 수 없음 — Not found">
<meta name="twitter:description" content="이 주소에는 페이지가 없습니다.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{--ink:#16181d;--muted:#5b6270;--rule:#e3e6ec;--paper:#fff;--cta:#1f5fe0;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--ink:#e8eaee;--muted:#9aa3b2;--rule:#2a2f38;--paper:#14161a;--cta:#7fa8ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
  word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.012em}

/* 산문 720px · 표/코드 896px. 두 폭이 같은 중심축을 쓰고,
   넓은 트랙은 표와 코드에만 준다 — 산문을 넓히면 왼쪽 모서리가 어긋나 사고로 읽힌다. */
main{max-width:none;margin:0;padding:96px 0 0}
main > :not(section){max-width:768px;margin:0 auto;padding:0 24px} /* 404 는 md() 를 안 거친다 */
section{--text:720px;--wide:88px;display:grid;
  grid-template-columns:
    [full-start] minmax(24px,1fr)
    [wide-start] minmax(0,var(--wide))
    [text-start] min(var(--text),100% - 48px)
    [text-end] minmax(0,var(--wide))
    [wide-end] minmax(24px,1fr) [full-end];}
section > *{grid-column:text;margin:0}
section > .tablewrap,section > pre{grid-column:wide}

/* 근접성 사다리 8·12·24·48·112 — 전부 4의 배수.
   그리드 아이템은 마진이 상쇄되지 않으므로 인접 규칙으로만 준다. 순서가 곧 규칙이다:
   `*+h3`(48) 이 `h2+*`(12) 보다 앞서므로 h2 다음의 h3 는 12px 로 묶인다. */
section > * + *{margin-top:24px}
section > * + h3{margin-top:48px}
section > h2 + *{margin-top:12px}
section > h3 + *{margin-top:8px}
section + section{margin-top:112px}

/* 크기 56/32/19/17/15/14 (3.29배) · 무게 800/700/600/400 */
h1{font-size:clamp(40px,5.6vw,56px);line-height:1.08;font-weight:800;letter-spacing:-.04em;text-wrap:balance}
h2{position:relative;font-size:32px;line-height:1.25;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
h3{font-size:15px;line-height:1.4;font-weight:700;letter-spacing:0;color:var(--muted)}
strong{font-weight:600}                 /* 지금은 strong=h2=h3=700 이라 강조가 제목과 같은 무게다 */
h2 strong,h3 strong{font-weight:inherit}

/* 번호 붙은 절의 숫자를 좌측 여백에 매단다. 배경·테두리·점·포인트색 전부 없음. */
h2 .idx{position:absolute;right:100%;margin-right:16px;top:2px; /* 2px = 광학 보정 */
  font-size:24px;font-weight:700;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:944px){               /* wide 트랙이 88px 를 못 채우는 구간 */
  h2 .idx{position:static;margin-right:0;font-size:inherit;color:inherit;letter-spacing:inherit}
  h2 .idx::after{content:". "}
}

/* 상단 언어·홈 한 줄. 폭은 main > :not(section) 이 이미 본문 열(720px)에 맞춰 주므로
   여기서는 크기와 아래 간격만 정한다. 사다리 값 48 을 그대로 쓴다. */
.lang{font-size:15px;color:var(--muted);margin-bottom:48px}
.lang a{color:var(--muted)}

a{color:var(--cta);text-underline-offset:3px;text-decoration-thickness:1px}
ul,ol{padding-left:20px}
li{margin:0 0 8px}
li:last-child{margin-bottom:0}
/* problems 에 7번 반복되는 2px 세로선을 없앤다. 고객 목소리를 muted 로 흐리지 않는다. */
blockquote{padding-left:24px;border:0;font-size:19px;line-height:1.55;letter-spacing:-.025em;color:var(--ink)}
sub{font-size:15px;line-height:1.6;color:var(--muted);vertical-align:baseline}

/* 코드 = 두 번째 서체. 상태코드가 이 사이트의 증거인데 지금은 본문 산세리프로 나온다.
   시스템 모노라 웹폰트는 여전히 0개. <code>/<pre> 밖에서는 절대 쓰지 않는다. */
code,pre{font-family:var(--mono);letter-spacing:0;font-variant-numeric:tabular-nums}
code{font-size:.88em;background:rgba(127,127,127,.12);padding:2px 4px;border-radius:3px}
pre{overflow-x:auto;padding:24px;background:rgba(127,127,127,.06);border-radius:2px;font-size:15px;line-height:1.7}
pre code{background:none;padding:0;font-size:inherit}

/* 표를 주인공으로. 본문(17px)보다 작지 않게, 산문보다 176px 넓게.
   행별 실선을 없애고 머리 1줄·바닥 1줄만 남긴다 — 반복 단위 안 실선 0.
   열 폭은 지정하지 않는다: 자동 레이아웃이 「2024.2」를 57px, 문장 열을 넓게 알아서 잡는다. */
.tablewrap{overflow-x:auto}             /* margin 을 쓰면 (0,1,0) 이 section>*+* 를 이겨 표가 0px 로 붙는다 */
table{width:100%;border-collapse:collapse;font-size:17px;
  font-variant-numeric:tabular-nums;border-bottom:1px solid var(--rule)}
thead th{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0;
  text-align:left;padding:0 20px 12px 0;border-bottom:1px solid var(--ink)}
td{text-align:left;vertical-align:top;padding:20px 20px 20px 0;line-height:1.5;border:0}
td:first-child{font-weight:600}
td strong{font-weight:700}              /* 크기는 올리지 않는다 — 셀 전체가 strong 인 칸이 여럿이다 */
td code{font-size:.82em}
thead:has(th:empty){display:none}                        /* resume.md 의 `| | |` */
table:has(thead th:empty){border-top:1px solid var(--rule)}
/* td:last-child{color:var(--muted)} 는 삭제했다 — 이 규칙이 「개편 후」와
   「제가 하는 것」, 즉 이 사이트의 증거 열만 정확히 흐리고 있었다. */

footer{max-width:768px;margin:112px auto 0;padding:24px 24px 96px;
  border-top:1px solid var(--rule);color:var(--muted);font-size:15px;line-height:1.6}
footer p{margin:0}

@media (max-width:640px){
  main{padding-top:48px}
  section + section{margin-top:72px}
  section > * + h3{margin-top:40px}
  h2{font-size:26px}
  blockquote{font-size:18px}
  table{font-size:16px}
  td{padding:20px 16px 20px 0}          /* 세로 20 유지: 16 이면 32/24=1.33 으로 근접성 하한 붕괴 */
  thead th{padding:0 16px 12px 0}
  footer{margin-top:72px;padding-bottom:64px}
}</style>
</head>
<body>
<main>

<h1>404</h1><p>이 주소에는 페이지가 없습니다. There is no page at this address.</p>
<p><a href="/">처음으로</a> · <a href="/en/index.html">Home</a></p>
</main>
<footer>
  <p>2026-08-22 작성. 프레임워크 없이 마크다운에서 만들었고, 이 사이트의 소스는
  <a href="https://github.com/forblune/forblune.github.io">같은 저장소</a>에 있습니다.</p>
</footer>
</body>
</html>
