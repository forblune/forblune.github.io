<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지를 찾을 수 없음</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="이 주소에는 페이지가 없습니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="페이지를 찾을 수 없음">
<meta property="og:description" content="이 주소에는 페이지가 없습니다.">
<meta property="og:url" content="https://forblune.github.io/404.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="페이지를 찾을 수 없음">
<meta name="twitter:description" content="이 주소에는 페이지가 없습니다.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{--ink:#16181d;--muted:#5b6270;--rule:#e3e6ec;--paper:#fff;--cta:#1f5fe0}
@media (prefers-color-scheme:dark){:root{--ink:#e8eaee;--muted:#9aa3b2;--rule:#2a2f38;--paper:#14161a;--cta:#7fa8ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;
  word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.01em}
main,footer{max-width:760px;margin:0 auto;padding:0 24px}
main{padding-top:64px;padding-bottom:24px}
h1{font-size:2rem;line-height:1.25;margin:0 0 16px;letter-spacing:-.03em;text-wrap:balance}
h2{font-size:1.5rem;line-height:1.3;margin:56px 0 16px;letter-spacing:-.025em;text-wrap:balance}
h3{font-size:1.125rem;margin:32px 0 8px;letter-spacing:-.02em}
p{margin:0 0 16px}
a{color:var(--cta);text-underline-offset:3px}
hr{border:0;border-top:1px solid var(--rule);margin:48px 0}
ul,ol{margin:0 0 16px;padding-left:20px}
li{margin:8px 0}
blockquote{margin:24px 0;padding:0 0 0 16px;border-left:2px solid var(--rule);color:var(--muted)}
code{font-size:.9em;background:rgba(127,127,127,.12);padding:2px 5px;border-radius:3px}
pre{overflow-x:auto;margin:24px 0;padding:16px;background:rgba(127,127,127,.08);border-radius:4px;font-size:.86rem;line-height:1.6}
pre code{background:none;padding:0}
.tablewrap{overflow-x:auto;margin:0 0 16px}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th,td{text-align:left;vertical-align:top;padding:12px 12px 12px 0;border-bottom:1px solid var(--rule);line-height:1.6}
/* 프로젝트 이름이 두 줄로 깨지면 안 된다 — 어절 쪼개짐을 측정한다고 써둔 표다 */
td:first-child,th:first-child{white-space:nowrap;padding-right:20px}
@media (max-width:520px){td:first-child,th:first-child{white-space:normal}}
th{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:0}
td:last-child{color:var(--muted)}
footer{border-top:1px solid var(--rule);margin-top:64px;padding-top:24px;padding-bottom:64px;color:var(--muted);font-size:.88rem}
@media (max-width:640px){main{padding-top:40px}h1{font-size:1.6rem}h2{font-size:1.3rem;margin-top:44px}}
</style>
</head>
<body>
<main>
<h1>404</h1><p>이 주소에는 페이지가 없습니다.</p><p><a href="/">처음으로</a></p>
</main>
<footer>
  <p>2026-08-19 작성. 프레임워크 없이 마크다운에서 만들었고, 이 사이트의 소스는
  <a href="https://github.com/forblune/forblune.github.io">같은 저장소</a>에 있습니다.</p>
</footer>
</body>
</html>
